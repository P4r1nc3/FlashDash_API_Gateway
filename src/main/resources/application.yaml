server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8085/realms/flashdash
          jwk-set-uri: http://localhost:8085/realms/flashdash/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: flashdash-core-routes
          uri: http://127.0.0.1:8000
          predicates:
            - Path=/**

keycloak:
  realm: flashdash
  client-id: flashdash-api-client
  client-secret: ${KEYCLOAK_SECRET}
  auth-server-url: http://localhost:8085
  admin-client-id: admin-cli
  adminClientSecret: ${KEYCLOAK_SECRET}
  admin-username: admin
  admin-password: admin
  bearer-only: true

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.http.server.reactive: TRACE
    org.springframework.cloud.gateway.filter: DEBUG
    org.springframework.cloud.gateway.route: DEBUG
